<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">قصر بازی | Game Palace</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0f0a;
    --panel: #14170f;
    --phosphor: #ffb000;
    --phosphor-dim: #8a5f00;
    --phosphor-bright: #ffd166;
    --line: #3a3020;
    --danger: #ff5a4e;
    --ok: #7cff8e;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(ellipse at center, #171a10 0%, var(--bg) 70%);
    color: var(--phosphor);
    font-family: 'Vazirmatn', sans-serif;
    min-height:100%;
    overflow-x:hidden;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 2px, transparent 3px);
    pointer-events:none;
    mix-blend-mode: multiply;
    z-index: 50;
  }
  h1,h2,.pixel{ font-family:'Press Start 2P', monospace; }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 22px 16px 60px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 2px solid var(--line);
    padding-bottom: 14px; margin-bottom: 20px;
    gap: 12px;
  }
  .title-group{ display:flex; align-items:center; gap:10px; }
  .logo-mark{ width:44px; height:44px; flex-shrink:0; }
  header.top h1{
    font-size: 15px; color: var(--phosphor-bright);
    letter-spacing: 1px; margin:0;
    text-shadow: 0 0 8px rgba(255,176,0,0.5);
  }
  header.top .en{
    display:block; font-family:'Press Start 2P',monospace; font-size:8px;
    color: var(--phosphor-dim); margin-top:6px; letter-spacing:1px;
  }
  .coin{
    font-size: 11px; color: var(--phosphor-dim); font-family:'Press Start 2P',monospace;
  }
  #langBtn{
    background:none; border: 2px solid var(--line); color: var(--phosphor);
    font-family:'Press Start 2P',monospace; font-size:10px;
    padding: 7px 10px; border-radius:4px; cursor:pointer; margin-top:6px;
  }
  #langBtn:hover{ border-color: var(--phosphor); }
  .top-right{ text-align:left; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }

  /* menu grid */
  #menu{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .card{
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 4px;
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover, .card:active{ border-color: var(--phosphor); transform: translateY(-2px); }
  .card .num{ font-family:'Press Start 2P',monospace; font-size: 10px; color: var(--phosphor-dim); display:block; margin-bottom:8px;}
  .card .icon{ font-size: 28px; display:block; margin-bottom: 8px; }
  .card .label{ font-size: 13px; font-weight:600; color: var(--phosphor-bright); display:block; }
  .card .en{ font-size: 9px; color: var(--phosphor-dim); display:block; margin-top:4px; letter-spacing:0.5px; direction:ltr; }

  /* game view */
  #gameView{ display:none; }
  .gamebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 16px;
  }
  .back{
    background:none; border: 2px solid var(--line); color: var(--phosphor);
    font-family:'Vazirmatn'; font-weight:600; font-size:13px;
    padding: 8px 14px; border-radius:4px; cursor:pointer;
  }
  .back:hover{ border-color: var(--phosphor); }
  .gtitle{ font-size: 12px; color: var(--phosphor-bright); font-family:'Press Start 2P',monospace; }

  .panel{
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    min-height: 320px;
  }
  .status{ text-align:center; font-size:14px; color: var(--phosphor-bright); margin-bottom:14px; min-height: 20px; }
  .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.act{
    background: var(--phosphor); color:#1a1204; border:none; border-radius:4px;
    padding: 10px 18px; font-weight:800; font-size:14px; cursor:pointer;
    font-family:'Vazirmatn'; box-shadow: 0 0 10px rgba(255,176,0,0.25);
  }
  button.act:active{ transform: scale(0.97); }
  button.ghost{
    background:transparent; color:var(--phosphor); border:2px solid var(--line);
    border-radius:4px; padding:10px 16px; font-size:14px; cursor:pointer; font-family:'Vazirmatn'; font-weight:600;
  }

  /* Tic tac toe */
  #ttt-board{ display:grid; grid-template-columns:repeat(3,72px); grid-template-rows:repeat(3,72px); gap:6px; justify-content:center; margin: 10px auto; }
  #ttt-board .cell{
    background:#1c2013; border:2px solid var(--line); border-radius:4px;
    font-size: 30px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: var(--phosphor-bright);
  }

  /* RPS */
  .rps-choices{ display:flex; gap:14px; justify-content:center; margin-top:10px; }
  .rps-choices button{ font-size:34px; background:#1c2013; border:2px solid var(--line); border-radius:8px; padding:14px 18px; cursor:pointer; }
  .rps-choices button:hover{ border-color: var(--phosphor); }
  .rps-choices button:disabled{ opacity:0.4; cursor:default; }
  .rps-result{ text-align:center; font-size: 30px; margin: 14px 0; }

  /* memory */
  #mem-board{ display:grid; grid-template-columns:repeat(4,64px); gap:8px; justify-content:center; margin:10px auto; }
  #mem-board .card2{
    width:64px; height:64px; background:#1c2013; border:2px solid var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer;
  }
  #mem-board .card2.flipped, #mem-board .card2.matched{ background: #2a2416; border-color: var(--phosphor-dim); }

  /* reaction */
  #reactBox{
    height: 220px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; cursor:pointer; text-align:center; padding:20px;
    background:#3a1414; color:#ffb1a8; border:2px solid #5a1f1f;
  }
  #reactBox.go{ background:#123a17; color:var(--ok); border-color:#1f5a2a; }

  /* simon */
  #simon-grid{ display:grid; grid-template-columns:repeat(2,100px); grid-template-rows:repeat(2,100px); gap:8px; justify-content:center; margin: 14px auto; }
  .simon-btn{ border-radius:8px; opacity:0.55; cursor:pointer; border: 2px solid #000; transition: opacity .1s; }
  .simon-btn.lit{ opacity:1; box-shadow: 0 0 16px currentColor; }
  #s0{background:#ff5a4e;color:#ff5a4e;} #s1{background:#7cff8e;color:#7cff8e;}
  #s2{background:#5aa9ff;color:#5aa9ff;} #s3{background:#ffd166;color:#ffd166;}

  /* snake */
  #snakeCanvas{ display:block; margin: 0 auto; background:#0f1108; border:2px solid var(--line); border-radius:6px; touch-action:none; }
  .dpad{ display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:4px; justify-content:center; margin-top:12px; }
  .dpad button{ background:#1c2013; border:2px solid var(--line); color:var(--phosphor); border-radius:6px; font-size:18px; }

  /* whack a mole */
  #mole-grid{ display:grid; grid-template-columns:repeat(3,80px); gap:10px; justify-content:center; margin:10px auto; }
  .hole{ width:80px; height:80px; background:#1c2013; border:2px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px; cursor:pointer; }
  .hole.up{ background:#2a2416; }

  /* math quiz */
  #mathQ{ font-size: 26px; text-align:center; margin: 20px 0; color:var(--phosphor-bright); font-weight:800; }
  .mathopts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mathopts button{ font-size:18px; padding:14px; background:#1c2013; border:2px solid var(--line); border-radius:6px; color:var(--phosphor); cursor:pointer; }

  /* click speed */
  #cps-target{ width:150px; height:150px; border-radius:50%; background:var(--phosphor); margin:20px auto; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#1a1204; font-weight:800; font-size:15px; user-select:none; }

  .bignum{ font-family:'Press Start 2P',monospace; font-size:26px; text-align:center; color:var(--phosphor-bright); margin: 10px 0; }
  .hint{ text-align:center; font-size:12px; color:var(--phosphor-dim); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-group">
      <svg class="logo-mark" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="نماد قصر بازی">
        <defs>
          <radialGradient id="bgm" cx="50%" cy="42%" r="65%">
            <stop offset="0%" stop-color="#1b1f12"/>
            <stop offset="100%" stop-color="#0a0c07"/>
          </radialGradient>
          <linearGradient id="ringm" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#b87800"/>
          </linearGradient>
        </defs>
        <circle cx="180" cy="180" r="176" fill="url(#bgm)"/>
        <circle cx="180" cy="180" r="164" fill="none" stroke="url(#ringm)" stroke-width="6"/>
        <rect x="150" y="118" width="60" height="14" rx="3" fill="#ffb000"/>
        <rect x="172" y="96" width="16" height="34" rx="4" fill="#ffb000"/>
        <circle cx="180" cy="90" r="15" fill="#ffd166"/>
        <circle cx="151" cy="150" r="9" fill="#ff5a4e"/>
        <circle cx="209" cy="150" r="9" fill="#7cff8e"/>
        <text x="180" y="228" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffd166">قصر بازی</text>
        <text x="180" y="258" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="6" fill="#8a5f00">GAME PALACE</text>
      </svg>
      <h1 id="mainTitle">قصر بازی<span class="en" id="mainTitleEn">GAME PALACE</span></h1>
    </div>
    <div class="top-right">
      <span class="coin" id="coinLine"></span>
      <button id="langBtn" onclick="toggleLang()">EN / FA</button>
    </div>
  </header>

  <div id="menu"></div>

  <div id="gameView">
    <div class="gamebar">
      <button class="back" id="backBtn" onclick="showMenu()">‹ بازگشت به فهرست</button>
      <span class="gtitle" id="gtitle"></span>
    </div>
    <div class="panel" id="panel"></div>
  </div>

</div>

<script>
/* ---------------- TRANSLATIONS ---------------- */
let lang = 'fa';
let currentGameId = null;

const T = {
  fa: {
    title:'قصر بازی', titleEn:'GAME PALACE', back:'‹ بازگشت به فهرست',
    coin: n=>`INSERT COIN ▸ ${n} بازی`,
    ttt: { turn: p=>`نوبت بازیکن: ${p}`, win: p=>`🎉 بازیکن ${p} برنده شد!`, draw:'مساوی شد!', reset:'شروع دوباره', chooseMode:'یک حالت را انتخاب کن', vsBot:'با ربات', vsPerson:'با یک نفر دیگر', changeMode:'تغییر حالت', botThinking:'نوبت ربات...', youWin:'🎉 تو بردی!', botWin:'🤖 ربات برد!' },
    rps: { sub:'با ربات بازی کن', tie:'مساوی 🤝', win:'بردی! 🎉', lose:'باختی 😅', vs:(a,b)=>`${a}  در برابر  ${b}`, count:['۳','۲','۱','بزن!'] },
    guess: { sub:'عددی بین ۱ تا ۱۰۰ حدس بزن', btn:'حدس بزن', correct:n=>`✅ درست حدس زدی! (${n})`, higher:'⬆️ عدد بزرگتر است', lower:'⬇️ عدد کوچکتر است', tries:n=>`تعداد تلاش: ${n}` },
    memory: { sub:'دو کارت را برگردان تا جفتشان کنی', done:'🎉 همه جفت‌ها پیدا شد!', chooseMode:'یک حالت را انتخاب کن', solo:'تک‌نفره', vsBot:'با ربات', vsPerson:'با یک نفر دیگر', changeMode:'تغییر حالت', yourTurn:'نوبت توئه', botTurn:'نوبت رباته...', p1Turn:'نوبت بازیکن ۱', p2Turn:'نوبت بازیکن ۲', score:(a,b)=>`امتیاز تو: ${a} — امتیاز ربات: ${b}`, scoreP:(a,b)=>`بازیکن ۱: ${a} — بازیکن ۲: ${b}`, youWin:'🎉 تو بردی!', botWinM:'🤖 ربات برد!', tieM:'مساوی شد!', p1Win:'🎉 بازیکن ۱ برد!', p2Win:'🎉 بازیکن ۲ برد!' },
    react: { start:'برای شروع کلیک کن', hint:'وقتی رنگ سبز شد، هرچه سریع‌تر کلیک کن', wait:'صبر کن...', go:'حالا کلیک کن!', early:'❌ زودتر از موعد کلیک کردی! دوباره امتحان کن', result:ms=>`⏱️ زمان واکنش تو: ${ms} میلی‌ثانیه — دوباره کلیک کن` },
    simon: { start:'شروع', ready:'برای شروع دکمه را بزن', watch:'توالی را تماشا کن...', yourTurn:'حالا نوبت توئه!', score:n=>`امتیاز: ${n}`, lose:n=>`❌ باختی! امتیاز نهایی: ${n}` },
    snake: { chooseLevel:'یک سطح را انتخاب کن', levels:['آسان','متوسط','سخت'], instructions:'با انگشت روی صفحه بکش، دکمه‌ها یا کلیدهای جهت‌نما را بزن', changeLevel:'تغییر سطح', score:(s,lv)=>`امتیاز: ${s} — سطح: ${lv}`, dead:s=>`💀 باختی! امتیاز: ${s} — برای شروع دوباره کلیک کن` },
    whack: { hint:'روی موش وقتی بیرون آمد کلیک کن', start:'شروع (۲۰ ثانیه)', score:n=>`امتیاز: ${n}`, timeLeft:n=>`زمان باقی‌مانده: ${n}`, done:n=>`⏰ تمام شد! امتیاز نهایی: ${n}` },
    math: { sub:'۱۰ سوال ریاضی، تا جای ممکن سریع جواب بده', progress:(q,tt,s)=>`سوال ${q} از ${tt} — امتیاز: ${s}`, done:(s,tt)=>`🎉 تمام شد! امتیاز: ${s} از ${tt}` },
    cps: { start:'دایره را برای شروع کلیک کن (۵ ثانیه)', click:'کلیک کن', go:'کلیک کن!', timeLeft:s=>`زمان باقی‌مانده: ${s}`, done:'تمام شد!', result:(c,cps)=>`${c} کلیک — ${cps} کلیک بر ثانیه`, retry:'دوباره امتحان کن' },
  },
  en: {
    title:'Game Palace', titleEn:'قصر بازی', back:'‹ Back to menu',
    coin: n=>`INSERT COIN ▸ ${n} GAMES`,
    ttt: { turn: p=>`Player's turn: ${p}`, win: p=>`🎉 Player ${p} wins!`, draw:"It's a draw!", reset:'Restart', chooseMode:'Choose a mode', vsBot:'vs Bot', vsPerson:'vs Another Person', changeMode:'Change mode', botThinking:"Bot's turn...", youWin:'🎉 You win!', botWin:'🤖 Bot wins!' },
    rps: { sub:'Play against the bot', tie:"It's a tie 🤝", win:'You win! 🎉', lose:'You lose 😅', vs:(a,b)=>`${a}  vs  ${b}`, count:['3','2','1','Go!'] },
    guess: { sub:'Guess a number between 1 and 100', btn:'Guess', correct:n=>`✅ You got it! (${n})`, higher:'⬆️ Higher than that', lower:'⬇️ Lower than that', tries:n=>`Attempts: ${n}` },
    memory: { sub:'Flip two cards to find a match', done:'🎉 All pairs found!', chooseMode:'Choose a mode', solo:'Solo', vsBot:'vs Bot', vsPerson:'vs Another Person', changeMode:'Change mode', yourTurn:'Your turn', botTurn:"Bot's turn...", p1Turn:"Player 1's turn", p2Turn:"Player 2's turn", score:(a,b)=>`You: ${a} — Bot: ${b}`, scoreP:(a,b)=>`Player 1: ${a} — Player 2: ${b}`, youWin:'🎉 You win!', botWinM:'🤖 Bot wins!', tieM:"It's a tie!", p1Win:'🎉 Player 1 wins!', p2Win:'🎉 Player 2 wins!' },
    react: { start:'Click to start', hint:'When it turns green, click as fast as you can', wait:'Wait...', go:'Click now!', early:'❌ Too soon! Try again', result:ms=>`⏱️ Your reaction time: ${ms} ms — click to try again` },
    simon: { start:'Start', ready:'Press the button to start', watch:'Watch the sequence...', yourTurn:'Your turn now!', score:n=>`Score: ${n}`, lose:n=>`❌ You lost! Final score: ${n}` },
    snake: { chooseLevel:'Choose a level', levels:['Easy','Medium','Hard'], instructions:'Swipe on the screen, use the buttons, or the arrow keys', changeLevel:'Change level', score:(s,lv)=>`Score: ${s} — Level: ${lv}`, dead:s=>`💀 Game over! Score: ${s} — click to restart` },
    whack: { hint:'Click the mole when it pops up', start:'Start (20s)', score:n=>`Score: ${n}`, timeLeft:n=>`Time left: ${n}`, done:n=>`⏰ Time's up! Final score: ${n}` },
    math: { sub:'10 math questions — answer as fast as you can', progress:(q,tt,s)=>`Question ${q} of ${tt} — Score: ${s}`, done:(s,tt)=>`🎉 Done! Score: ${s} out of ${tt}` },
    cps: { start:'Click the circle to start (5s)', click:'Click', go:'Click!', timeLeft:s=>`Time left: ${s}`, done:'Done!', result:(c,cps)=>`${c} clicks — ${cps} clicks/sec`, retry:'Try again' },
  },
};

function toggleLang(){
  lang = lang==='fa' ? 'en' : 'fa';
  document.documentElement.lang = lang==='fa' ? 'fa' : 'en';
  document.documentElement.dir = lang==='fa' ? 'rtl' : 'ltr';
  const t = T[lang];
  document.getElementById('mainTitle').firstChild.textContent = t.title;
  document.getElementById('mainTitleEn').textContent = t.titleEn;
  document.getElementById('coinLine').textContent = t.coin(games.length);
  document.getElementById('backBtn').textContent = t.back;
  document.getElementById('pageTitle').textContent = lang==='fa' ? 'قصر بازی | Game Palace' : 'Game Palace | قصر بازی';
  renderMenu();
  if(document.getElementById('gameView').style.display === 'block' && currentGameId){
    openGame(currentGameId);
  }
}

/* ---------------- MENU ---------------- */
const games = [
  {id:'ttt', icon:'❌⭕', label:'دوز', en:'Tic-Tac-Toe'},
  {id:'rps', icon:'✊✋✌️', label:'سنگ کاغذ قیچی', en:'Rock Paper Scissors'},
  {id:'guess', icon:'🔢', label:'حدس عدد', en:'Guess the Number'},
  {id:'memory', icon:'🃏', label:'بازی حافظه', en:'Memory Match'},
  {id:'react', icon:'⚡', label:'تست سرعت واکنش', en:'Reaction Test'},
  {id:'simon', icon:'🎨', label:'سایمون بگو', en:'Simon Says'},
  {id:'snake', icon:'🐍', label:'مار', en:'Snake'},
  {id:'whack', icon:'🔨', label:'بزن دربیار', en:'Whack-a-Mole'},
  {id:'math', icon:'➕', label:'کوییز ریاضی', en:'Math Quiz'},
  {id:'cps', icon:'🖱️', label:'سرعت کلیک', en:'Click Speed'},
];

const menu = document.getElementById('menu');
function renderMenu(){
  menu.innerHTML = '';
  games.forEach((g,i)=>{
    const primary = lang==='fa' ? g.label : g.en;
    const secondary = lang==='fa' ? g.en : g.label;
    const d = document.createElement('div');
    d.className='card';
    d.innerHTML = `<span class="num">GAME ${String(i+1).padStart(2,'0')}</span><span class="icon">${g.icon}</span><span class="label">${primary}</span><span class="en">${secondary}</span>`;
    d.onclick = ()=> openGame(g.id);
    menu.appendChild(d);
  });
}
renderMenu();
document.getElementById('coinLine').textContent = T.fa.coin(games.length);

let activeCleanup = null;
function showMenu(){
  document.getElementById('gameView').style.display='none';
  document.getElementById('menu').style.display='grid';
  currentGameId = null;
  if(activeCleanup){ activeCleanup(); activeCleanup=null; }
}
function openGame(id){
  document.getElementById('menu').style.display='none';
  document.getElementById('gameView').style.display='block';
  currentGameId = id;
  const g = games.find(x=>x.id===id);
  const primary = lang==='fa' ? g.label : g.en;
  const secondary = lang==='fa' ? g.en : g.label;
  document.getElementById('gtitle').textContent = g ? `${primary} · ${secondary}` : id;
  const panel = document.getElementById('panel');
  panel.innerHTML='';
  if(activeCleanup) activeCleanup();
  activeCleanup = initGame(id, panel);
}

function initGame(id, panel){
  switch(id){
    case 'ttt': return gameTTT(panel);
    case 'rps': return gameRPS(panel);
    case 'guess': return gameGuess(panel);
    case 'memory': return gameMemory(panel);
    case 'react': return gameReact(panel);
    case 'simon': return gameSimon(panel);
    case 'snake': return gameSnake(panel);
    case 'whack': return gameWhack(panel);
    case 'math': return gameMath(panel);
    case 'cps': return gameCPS(panel);
  }
}

/* ---------------- 1. TIC TAC TOE ---------------- */
function gameTTT(panel){
  const t = T[lang].ttt;
  panel.innerHTML = `<div class="status">${t.chooseMode}</div>
    <div class="row" style="margin:16px 0;">
      <button class="act" id="ttt-vsbot">🤖 ${t.vsBot}</button>
      <button class="act" id="ttt-vsperson">🧑‍🤝‍🧑 ${t.vsPerson}</button>
    </div>`;
  document.getElementById('ttt-vsbot').onclick = ()=> startTTT('bot');
  document.getElementById('ttt-vsperson').onclick = ()=> startTTT('person');

  let cleanup = ()=>{};
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function checkWin(bd){
    for(const [a,b,c] of wins){ if(bd[a] && bd[a]===bd[b] && bd[b]===bd[c]) return bd[a]; }
    return null;
  }
  function minimax(bd, player){
    const winner = checkWin(bd);
    if(winner==='O') return {score:1};
    if(winner==='X') return {score:-1};
    if(bd.every(v=>v)) return {score:0};
    let best = null;
    bd.forEach((v,i)=>{
      if(v) return;
      const nb = bd.slice(); nb[i]=player;
      const r = minimax(nb, player==='O'?'X':'O');
      const cand = {idx:i, score:r.score};
      if(best===null) best = cand;
      else if(player==='O' && cand.score>best.score) best = cand;
      else if(player==='X' && cand.score<best.score) best = cand;
    });
    return best;
  }

  function startTTT(mode){
    panel.innerHTML = `<div class="status" id="ttt-status"></div>
      <div id="ttt-board"></div>
      <div class="row" style="margin-top:14px;">
        <button class="ghost" id="ttt-reset">${t.reset}</button>
        <button class="ghost" id="ttt-changemode">${t.changeMode}</button>
      </div>`;
    const board = document.getElementById('ttt-board');
    const statusEl = document.getElementById('ttt-status');
    let cells, turn, over, botTimeout;

    function render(){
      board.innerHTML='';
      cells.forEach((v,idx)=>{
        const c = document.createElement('div');
        c.className='cell';
        c.textContent = v==='X'?'❌':v==='O'?'⭕':'';
        c.onclick = ()=> humanMove(idx);
        board.appendChild(c);
      });
    }
    function humanMove(idx){
      if(over || cells[idx]) return;
      if(mode==='bot' && turn!=='X') return;
      place(idx, turn);
    }
    function botMove(){
      if(over) return;
      statusEl.textContent = t.botThinking;
      botTimeout = setTimeout(()=>{
        const best = minimax(cells, 'O');
        if(best && best.idx!==undefined) place(best.idx, 'O');
      }, 450);
    }
    function place(idx, sym){
      if(over || cells[idx]) return;
      cells[idx]=sym;
      render();
      const w = checkWin(cells);
      if(w){
        over = true;
        statusEl.textContent = mode==='bot' ? (w==='X' ? t.youWin : t.botWin) : t.win(w==='X'?'❌':'⭕');
        return;
      }
      if(cells.every(v=>v)){ over=true; statusEl.textContent=t.draw; return; }
      turn = turn==='X' ? 'O' : 'X';
      if(mode==='bot' && turn==='O'){ botMove(); }
      else { statusEl.textContent = t.turn(turn==='X'?'❌':'⭕'); }
    }
    function reset(){
      cells = Array(9).fill(null);
      turn='X'; over=false;
      clearTimeout(botTimeout);
      statusEl.textContent = t.turn('❌');
      render();
    }
    document.getElementById('ttt-reset').onclick = reset;
    document.getElementById('ttt-changemode').onclick = ()=>{ clearTimeout(botTimeout); gameTTT(panel); };
    reset();
    cleanup = ()=>{ clearTimeout(botTimeout); };
  }

  return ()=>cleanup();
}

/* ---------------- 2. ROCK PAPER SCISSORS ---------------- */
function gameRPS(panel){
  const t = T[lang].rps;
  panel.innerHTML = `<div class="status">${t.sub}</div>
    <div class="rps-result" id="rps-result">🤖</div>
    <div class="rps-choices" id="rps-choices">
      <button data-c="rock">✊</button>
      <button data-c="paper">✋</button>
      <button data-c="scissors">✌️</button>
    </div>
    <div class="bignum" id="rps-score">0 - 0</div>`;
  let me=0, bot=0, busy=false;
  const emo = {rock:'✊',paper:'✋',scissors:'✌️'};
  const beats = {rock:'scissors',paper:'rock',scissors:'paper'};
  const resultEl = document.getElementById('rps-result');
  const statusEl = panel.querySelector('.status');
  const btns = [...panel.querySelectorAll('.rps-choices button')];
  let timeouts = [];

  btns.forEach(b=>{
    b.onclick = ()=>{
      if(busy) return;
      busy = true;
      btns.forEach(x=>x.disabled = true);
      const c = b.dataset.c;
      let step = 0;
      resultEl.textContent = t.count[0];
      statusEl.textContent = '';
      function nextStep(){
        step++;
        if(step < t.count.length){
          resultEl.textContent = t.count[step];
          timeouts.push(setTimeout(nextStep, 380));
        } else {
          reveal(c);
        }
      }
      timeouts.push(setTimeout(nextStep, 380));
    };
  });

  function reveal(c){
    const opts = ['rock','paper','scissors'];
    const bc = opts[Math.floor(Math.random()*3)];
    let msg;
    if(c===bc){ msg=t.tie; }
    else if(beats[c]===bc){ msg=t.win; me++; }
    else { msg=t.lose; bot++; }
    resultEl.textContent = t.vs(emo[c], emo[bc]);
    document.getElementById('rps-score').textContent = `${me} - ${bot}`;
    statusEl.textContent = msg;
    btns.forEach(x=>x.disabled = false);
    busy = false;
  }

  return ()=>{ timeouts.forEach(clearTimeout); };
}

/* ---------------- 4. MEMORY MATCH ---------------- */
function gameMemory(panel){
  const t = T[lang].memory;
  panel.innerHTML = `<div class="status">${t.chooseMode}</div>
    <div class="row" style="margin:16px 0; flex-wrap:wrap;">
      <button class="act" id="mem-solo">${t.solo}</button>
      <button class="act" id="mem-vsbot">🤖 ${t.vsBot}</button>
      <button class="act" id="mem-vsperson">🧑‍🤝‍🧑 ${t.vsPerson}</button>
    </div>`;
  document.getElementById('mem-solo').onclick = ()=> startMemory('solo');
  document.getElementById('mem-vsbot').onclick = ()=> startMemory('bot');
  document.getElementById('mem-vsperson').onclick = ()=> startMemory('person');

  let cleanup = ()=>{};

  function startMemory(mode){
    const emojis = ['🍎','🍌','🍇','🍉','🍒','🍋','🍓','🥝'];
    let deck = [...emojis, ...emojis].sort(()=>Math.random()-0.5);
    panel.innerHTML = `<div class="status" id="mem-status"></div>
      <div id="mem-board"></div>
      <div class="row" style="margin-top:10px;"><button class="ghost" id="mem-changemode">${t.changeMode}</button></div>
      ${mode!=='solo' ? '<div class="bignum" id="mem-score"></div>' : ''}`;
    const board = document.getElementById('mem-board');
    const statusEl = document.getElementById('mem-status');
    const scoreEl = mode!=='solo' ? document.getElementById('mem-score') : null;

    let flipped = [];
    let matchedCount = 0;
    let lock = false;
    let turn = 'a';
    let scores = {a:0,b:0};
    let known = {};
    let botTimeout;
    const cardEls = [];

    deck.forEach((val, idx)=>{
      const c = document.createElement('div');
      c.className='card2';
      c.dataset.idx = idx;
      c.dataset.val = val;
      c.textContent = '❓';
      c.onclick = ()=> humanFlip(idx);
      board.appendChild(c);
      cardEls.push(c);
    });

    function turnLabel(){
      if(mode==='solo') return t.sub;
      if(mode==='bot') return turn==='a' ? t.yourTurn : t.botTurn;
      return turn==='a' ? t.p1Turn : t.p2Turn;
    }
    function updateScore(){
      if(!scoreEl) return;
      scoreEl.textContent = mode==='bot' ? t.score(scores.a, scores.b) : t.scoreP(scores.a, scores.b);
    }
    statusEl.textContent = turnLabel();
    updateScore();

    function humanFlip(idx){
      if(lock) return;
      if(mode==='bot' && turn!=='a') return;
      doFlip(idx);
    }
    function doFlip(idx){
      const c = cardEls[idx];
      if(!c || c.classList.contains('flipped') || c.classList.contains('matched')) return;
      c.classList.add('flipped');
      c.textContent = c.dataset.val;
      known[idx] = c.dataset.val;
      flipped.push(idx);
      if(flipped.length===2){
        lock = true;
        setTimeout(resolveTurn, 700);
      }
    }
    function resolveTurn(){
      const [i1,i2] = flipped;
      const c1 = cardEls[i1], c2 = cardEls[i2];
      const isMatch = c1.dataset.val === c2.dataset.val;
      if(isMatch){
        c1.classList.add('matched'); c1.classList.remove('flipped');
        c2.classList.add('matched'); c2.classList.remove('flipped');
        matchedCount++;
        if(mode!=='solo') scores[turn]++;
        updateScore();
      } else {
        c1.classList.remove('flipped'); c1.textContent='❓';
        c2.classList.remove('flipped'); c2.textContent='❓';
        if(mode!=='solo') turn = turn==='a' ? 'b' : 'a';
      }
      flipped=[]; lock=false;
      if(matchedCount === emojis.length){ finishGame(); return; }
      statusEl.textContent = turnLabel();
      if(mode==='bot' && turn==='b'){ botTimeout=setTimeout(botTurn, 600); }
    }
    function finishGame(){
      if(mode==='solo'){ statusEl.textContent = t.done; return; }
      if(mode==='bot'){
        statusEl.textContent = scores.a>scores.b ? t.youWin : scores.a<scores.b ? t.botWinM : t.tieM;
      } else {
        statusEl.textContent = scores.a>scores.b ? t.p1Win : scores.a<scores.b ? t.p2Win : t.tieM;
      }
    }
    function botTurn(){
      const unmatchedIdx = cardEls.map((c,i)=>i).filter(i=>!cardEls[i].classList.contains('matched'));
      const knownUnmatched = unmatchedIdx.filter(i=> known[i]!==undefined);
      let pick = null;
      for(const i of knownUnmatched){
        const j = knownUnmatched.find(k=> k!==i && known[k]===known[i]);
        if(j!==undefined){ pick=[i,j]; break; }
      }
      if(!pick){
        const unknownIdx = unmatchedIdx.filter(i=> known[i]===undefined);
        if(knownUnmatched.length>0 && unknownIdx.length>0){
          const a = knownUnmatched[Math.floor(Math.random()*knownUnmatched.length)];
          const b = unknownIdx[Math.floor(Math.random()*unknownIdx.length)];
          pick = [a,b];
        } else {
          const shuffled = unmatchedIdx.slice().sort(()=>Math.random()-0.5);
          pick = [shuffled[0], shuffled[1]];
        }
      }
      doFlip(pick[0]);
      botTimeout = setTimeout(()=> doFlip(pick[1]), 500);
    }

    document.getElementById('mem-changemode').onclick = ()=>{ clearTimeout(botTimeout); gameMemory(panel); };
    cleanup = ()=>{ clearTimeout(botTimeout); };
  }

  return ()=>cleanup();
}

/* ---------------- 5. REACTION TIME ---------------- */
function gameReact(panel){
  const t = T[lang].react;
  panel.innerHTML = `<div id="reactBox">${t.start}</div>
    <div class="hint">${t.hint}</div>`;
  const box = document.getElementById('reactBox');
  let state = 'idle'; // idle -> waiting -> go
  let timeoutId, startTime;
  box.onclick = ()=>{
    if(state==='idle'){
      state='waiting';
      box.textContent = t.wait;
      box.classList.remove('go');
      const delay = 1000 + Math.random()*2500;
      timeoutId = setTimeout(()=>{
        state='go';
        startTime = Date.now();
        box.classList.add('go');
        box.textContent = t.go;
      }, delay);
    } else if(state==='waiting'){
      clearTimeout(timeoutId);
      state='idle';
      box.classList.remove('go');
      box.textContent = t.early;
    } else if(state==='go'){
      const rt = Date.now()-startTime;
      state='idle';
      box.classList.remove('go');
      box.textContent = t.result(rt);
    }
  };
  return ()=>{ clearTimeout(timeoutId); };
}

function gameSimon(panel){
  const t = T[lang].simon;
  panel.innerHTML = `<div class="status" id="simon-status">${t.ready}</div>
    <div id="simon-grid">
      <div class="simon-btn" id="s0" style="width:100px;height:100px;"></div>
      <div class="simon-btn" id="s1" style="width:100px;height:100px;"></div>
      <div class="simon-btn" id="s2" style="width:100px;height:100px;"></div>
      <div class="simon-btn" id="s3" style="width:100px;height:100px;"></div>
    </div>
    <div class="row"><button class="act" id="simon-start">${t.start}</button></div>
    <div class="bignum" id="simon-score">${t.score(0)}</div>`;
  let seq = [], playerSeq = [], level = 0, accepting=false;
  const btns = [0,1,2,3].map(i=>document.getElementById('s'+i));
  function lightUp(i){
    return new Promise(res=>{
      btns[i].classList.add('lit');
      setTimeout(()=>{ btns[i].classList.remove('lit'); res(); }, 350);
    });
  }
  async function playSeq(){
    accepting=false;
    document.getElementById('simon-status').textContent=t.watch;
    for(const i of seq){ await lightUp(i); await new Promise(r=>setTimeout(r,150)); }
    accepting=true;
    playerSeq=[];
    document.getElementById('simon-status').textContent=t.yourTurn;
  }
  function nextRound(){
    seq.push(Math.floor(Math.random()*4));
    level++;
    document.getElementById('simon-score').textContent = t.score(level-1);
    playSeq();
  }
  btns.forEach((b,i)=>{
    b.onclick = async ()=>{
      if(!accepting) return;
      await lightUp(i);
      playerSeq.push(i);
      const idx = playerSeq.length-1;
      if(playerSeq[idx] !== seq[idx]){
        accepting=false;
        document.getElementById('simon-status').textContent = t.lose(level-1);
        return;
      }
      if(playerSeq.length === seq.length){
        setTimeout(nextRound, 600);
      }
    };
  });
  document.getElementById('simon-start').onclick = ()=>{ seq=[]; level=0; nextRound(); };
  return ()=>{};
}

/* ---------------- 7. SNAKE ---------------- */
function gameSnake(panel){
  const t = T[lang].snake;
  const LEVELS = [
    {name:t.levels[0], base:180, min:110, step:3, icon:'🐢'},
    {name:t.levels[1], base:130, min:80,  step:4, icon:'🐇'},
    {name:t.levels[2], base:95,  min:55,  step:5, icon:'🔥'},
  ];

  panel.innerHTML = `<div class="status">${t.chooseLevel}</div>
    <div class="row" id="snake-levels" style="margin:16px 0;"></div>`;
  const lvBox = document.getElementById('snake-levels');
  LEVELS.forEach((lv)=>{
    const b = document.createElement('button');
    b.className = 'act';
    b.style.minWidth = '90px';
    b.innerHTML = `${lv.icon}<br>${lv.name}`;
    b.onclick = ()=> startSnake(lv);
    lvBox.appendChild(b);
  });

  let cleanup = ()=>{};

  function startSnake(level){
    panel.innerHTML = `<div class="status" id="snake-status">${t.instructions}</div>
      <canvas id="snakeCanvas" width="280" height="280"></canvas>
      <div class="dpad">
        <span></span><button id="sn-up">▲</button><span></span>
        <button id="sn-left">◀</button><span></span><button id="sn-right">▶</button>
        <span></span><button id="sn-down">▼</button><span></span>
      </div>
      <div class="row" style="margin-top:10px;"><button class="ghost" id="sn-changelvl">${t.changeLevel}</button></div>
      <div class="bignum" id="snake-score">${t.score(0, level.name)}</div>`;

    const cv = document.getElementById('snakeCanvas');
    const ctx = cv.getContext('2d');
    const grid = 14, cell = 20;
    let snake, dir, food, score, alive, loopId;

    function currentInterval(){
      return Math.max(level.min, level.base - score*level.step);
    }
    function restartLoop(){
      clearInterval(loopId);
      loopId = setInterval(tick, currentInterval());
    }
    function reset(){
      snake = [{x:6,y:7},{x:5,y:7},{x:4,y:7}];
      dir = {x:1,y:0};
      score = 0;
      alive = true;
      placeFood();
      document.getElementById('snake-score').textContent = t.score(0, level.name);
      document.getElementById('snake-status').textContent = t.instructions;
      restartLoop();
    }
    function placeFood(){
      food = {x: Math.floor(Math.random()*grid), y: Math.floor(Math.random()*grid)};
    }
    function tick(){
      if(!alive) return;
      const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
      if(head.x<0||head.y<0||head.x>=grid||head.y>=grid|| snake.some(s=>s.x===head.x&&s.y===head.y)){
        alive=false;
        clearInterval(loopId);
        document.getElementById('snake-status').textContent = t.dead(score);
        return;
      }
      snake.unshift(head);
      if(head.x===food.x && head.y===food.y){
        score++;
        document.getElementById('snake-score').textContent = t.score(score, level.name);
        placeFood();
        restartLoop();
      } else {
        snake.pop();
      }
      draw();
    }
    function draw(){
      ctx.fillStyle = '#0f1108';
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle = '#ff5a4e';
      ctx.fillRect(food.x*cell, food.y*cell, cell-2, cell-2);
      snake.forEach((s,i)=>{
        ctx.fillStyle = i===0 ? '#ffd166' : '#ffb000';
        ctx.fillRect(s.x*cell, s.y*cell, cell-2, cell-2);
      });
    }
    function setDir(nx,ny){ if(dir.x===-nx && dir.y===-ny) return; dir={x:nx,y:ny}; }

    document.getElementById('sn-up').onclick=()=>setDir(0,-1);
    document.getElementById('sn-down').onclick=()=>setDir(0,1);
    document.getElementById('sn-left').onclick=()=>setDir(-1,0);
    document.getElementById('sn-right').onclick=()=>setDir(1,0);

    function keyHandler(e){
      if(e.key==='ArrowUp') setDir(0,-1);
      if(e.key==='ArrowDown') setDir(0,1);
      if(e.key==='ArrowLeft') setDir(-1,0);
      if(e.key==='ArrowRight') setDir(1,0);
      if(e.key===' ' && !alive) reset();
    }
    window.addEventListener('keydown', keyHandler);
    cv.onclick = ()=>{ if(!alive) reset(); };

    let touchStartX=0, touchStartY=0;
    function onTouchStart(e){
      const tt = e.touches[0];
      touchStartX = tt.clientX; touchStartY = tt.clientY;
    }
    function onTouchEnd(e){
      if(!alive){ reset(); return; }
      const tt = e.changedTouches[0];
      const dx = tt.clientX - touchStartX;
      const dy = tt.clientY - touchStartY;
      if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if(Math.abs(dx) > Math.abs(dy)){
        setDir(dx>0?1:-1, 0);
      } else {
        setDir(0, dy>0?1:-1);
      }
    }
    cv.addEventListener('touchstart', onTouchStart, {passive:true});
    cv.addEventListener('touchend', onTouchEnd, {passive:true});

    document.getElementById('sn-changelvl').onclick = ()=>{
      clearInterval(loopId);
      window.removeEventListener('keydown', keyHandler);
      cv.removeEventListener('touchstart', onTouchStart);
      cv.removeEventListener('touchend', onTouchEnd);
      gameSnake(panel);
    };

    reset();
    draw();
    cleanup = ()=>{
      clearInterval(loopId);
      window.removeEventListener('keydown', keyHandler);
      cv.removeEventListener('touchstart', onTouchStart);
      cv.removeEventListener('touchend', onTouchEnd);
    };
  }

  return ()=>cleanup();
}

  let score=0, running=false, spawnId, timerId, timeLeft=20, activeHole=null;

    if(activeHole) activeHole.classList.remove('up'), activeHole.textContent='';
    const h = holes[Math.floor(Math.random()*holes.length)];
    h.classList.add('up');
    h.textContent='🐹';

  document.getElementById('whack-start').onclick = ()=>{

    score=0; timeLeft=20; running=true;
    document.getElementById('whack-score').textContent=t.score(0);
    document.getElementById('whack-status').textContent = t.timeLeft(timeLeft);
    spawnId = setInterval(spawn, 700);

      document.getElementById('whack-status').textContent = t.timeLeft(timeLeft);

        clearInterval(spawnId); clearInterval(timerId); running=false;
        if(activeHole){ activeHole.classList.remove('up'); activeHole.textContent=''; }
        document.getElementById('whack-status').textContent = t.done(score);
      }
    },1000);

  return ()=>{ clearInterval(spawnId); clearInterval(timerId); };

function gameMath(panel){
  const t = T[lang].math;
  panel.innerHTML = `<div class="status">${t.sub}</div>
    <div id="mathQ"></div>
    <div class="mathopts" id="mathOpts"></div>
    <div class="bignum" id="mathScore">${t.progress(1,10,0)}</div>`;
  let qNum=0, score=0;
  const total=10;
  function newQ(){
    if(qNum>=total){
      document.getElementById('mathQ').textContent = t.done(score, total);
      document.getElementById('mathOpts').innerHTML='';
      return;
    }
    const ops = ['+','-','×'];
    const op = ops[Math.floor(Math.random()*ops.length)];
    let a = Math.floor(Math.random()*20)+1;
    let b = Math.floor(Math.random()*20)+1;
    if(op==='×'){ a = Math.floor(Math.random()*10)+1; b = Math.floor(Math.random()*10)+1; }
    if(op==='-' && b>a) [a,b]=[b,a];
    let ans = op==='+' ? a+b : op==='-' ? a-b : a*b;
    document.getElementById('mathQ').textContent = `${a} ${op} ${b} = ?`;
    let opts = new Set([ans]);
    while(opts.size<4) opts.add(ans + Math.floor(Math.random()*9)-4);
    opts = [...opts].sort(()=>Math.random()-0.5);
    const optsDiv = document.getElementById('mathOpts');
    optsDiv.innerHTML='';
    opts.forEach(o=>{
      const b2 = document.createElement('button');
      b2.textContent = o;
      b2.onclick = ()=>{
        if(o===ans) score++;
        qNum++;
        document.getElementById('mathScore').textContent = t.progress(Math.min(qNum+1,total), total, score);
        newQ();
      };
      optsDiv.appendChild(b2);
    });
  }
  newQ();
  return ()=>{};
}

/* ---------------- 10. CLICK SPEED TEST ---------------- */
function gameCPS(panel){
  const t = T[lang].cps;
  panel.innerHTML = `<div class="status" id="cps-status">${t.start}</div>
    <div id="cps-target">${t.click}</div>
    <div class="bignum" id="cps-result"></div>`;
  let clicks=0, running=false, endTime, rafId;
  const target = document.getElementById('cps-target');
  target.onclick = ()=>{
    if(!running){
      running=true; clicks=1; endTime = Date.now()+5000;
      target.textContent = clicks;
      document.getElementById('cps-status').textContent = t.go;
      tick();
    } else {
      clicks++;
      target.textContent = clicks;
    }
  };
  function tick(){
    const left = endTime - Date.now();
    if(left<=0){
      running=false;
      const cps = (clicks/5).toFixed(1);
      document.getElementById('cps-status').textContent = t.done;
      document.getElementById('cps-result').textContent = t.result(clicks, cps);
      target.textContent = t.retry;
      return;
    }
    document.getElementById('cps-status').textContent = t.timeLeft((left/1000).toFixed(1));
    rafId = requestAnimationFrame(tick);
  }
  return ()=>{ cancelAnimationFrame(rafId); };
}
